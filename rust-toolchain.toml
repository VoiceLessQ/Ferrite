[toolchain]
channel = "nightly-2025-08-29"
# windows-gnu: CI cross-build; linux-gnu: the Linux dev machine (2026-08).
targets = ["x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]
# rust-analyzer pinned to the toolchain so the VS Code extension uses a
# matching version instead of its bundled one; rust-src is its stdlib index.
components = ["rust-analyzer", "rust-src"]
